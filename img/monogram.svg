<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Single Slate Blue Accent matching "Daniel & Irene" on card -->
    <linearGradient id="slateBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b4e72" />
      <stop offset="100%" stop-color="#1b365d" />
    </linearGradient>

    <!-- Light Golden Accent for Ampersand -->
    <linearGradient id="lightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#c5a063" />
    </linearGradient>

    <!-- Soft Watercolor Leaf Gradient -->
    <radialGradient id="waterLeaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0c8dc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e9ebc" stop-opacity="0.85" />
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:ital,wght@1,400&amp;display=swap');
    
    .clean-script {
      font-family: 'Alex Brush', cursive;
      fill: url(#slateBlue);
      font-weight: 400;
    }
    .clean-amp {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      fill: url(#lightGold);
    }
  </style>

  <!-- Light Minimalist Botanical Wreath -->
  <g>
    <circle cx="250" cy="250" r="185" fill="none" stroke="url(#slateBlue)" stroke-width="1" opacity="0.25" stroke-dasharray="2 3"/>

    <!-- Watercolor Blue Sprigs Top Right -->
    <path d="M 250 65 C 335 65 415 125 435 210" fill="none" stroke="url(#slateBlue)" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="325" cy="78" rx="12" ry="6" transform="rotate(-20 325 78)" fill="url(#waterLeaf)"/>
    <ellipse cx="365" cy="105" rx="13" ry="6" transform="rotate(20 365 105)" fill="url(#waterLeaf)"/>
    <ellipse cx="402" cy="145" rx="12" ry="6" transform="rotate(45 402 145)" fill="url(#waterLeaf)"/>

    <!-- Watercolor Blue Sprigs Bottom Left -->
    <path d="M 250 435 C 165 435 85 375 65 290" fill="none" stroke="url(#slateBlue)" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="175" cy="422" rx="12" ry="6" transform="rotate(-20 175 422)" fill="url(#waterLeaf)"/>
    <ellipse cx="135" cy="395" rx="13" ry="6" transform="rotate(20 135 395)" fill="url(#waterLeaf)"/>
    <ellipse cx="98" cy="355" rx="12" ry="6" transform="rotate(45 98 355)" fill="url(#waterLeaf)"/>
  </g>

  <!-- Clean, Single-Stroke Cursive Monogram Initials D & I -->
  <g text-anchor="middle">
    <!-- Cursive D -->
    <text x="172" y="282" font-size="165" class="clean-script">D</text>

    <!-- Light Gold Ampersand & -->
    <text x="250" y="260" font-size="65" class="clean-amp">&amp;</text>

    <!-- Cursive I (Clean Single Stroke) -->
    <text x="328" y="282" font-size="165" class="clean-script">I</text>
  </g>
</svg>
