<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="25%" stop-color="#e6ca65" />
      <stop offset="50%" stop-color="#996515" />
      <stop offset="75%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <!-- Slate Blue Watercolor Leaf Gradient -->
    <radialGradient id="slateBlueLeaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9bb6cd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5a7b99" stop-opacity="0.9" />
    </radialGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8b6508" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Cormorant+Garamond:ital,wght@1,600&amp;display=swap');
    
    .gold-serif-letter {
      font-family: 'Cinzel', 'Cormorant Garamond', serif;
      font-weight: 600;
      fill: url(#goldFoil);
      filter: url(#softGlow);
    }
    .gold-ampersand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      fill: url(#goldFoil);
      filter: url(#softGlow);
    }
  </style>

  <!-- Dual Wreath: Gold Branch Ring + Dusty Slate Blue Watercolor Leaves -->
  <g>
    <!-- Inner Gold Branch Line -->
    <circle cx="250" cy="250" r="185" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" opacity="0.85"/>
    <circle cx="250" cy="250" r="180" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" opacity="0.5"/>

    <!-- Dusty Blue Eucalyptus Leaves around Wreath -->
    <ellipse cx="320" cy="74" rx="13" ry="6" transform="rotate(-20 320 74)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="365" cy="100" rx="14" ry="7" transform="rotate(20 365 100)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="405" cy="140" rx="13" ry="6" transform="rotate(45 405 140)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="426" cy="190" rx="14" ry="7" transform="rotate(65 426 190)" fill="url(#slateBlueLeaf)"/>

    <ellipse cx="180" cy="426" rx="13" ry="6" transform="rotate(-20 180 426)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="135" cy="400" rx="14" ry="7" transform="rotate(20 135 400)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="95" cy="360" rx="13" ry="6" transform="rotate(45 95 360)" fill="url(#slateBlueLeaf)"/>
    <ellipse cx="74" cy="310" rx="14" ry="7" transform="rotate(65 74 310)" fill="url(#slateBlueLeaf)"/>

    <!-- Small Gold Berries -->
    <circle cx="340" cy="85" r="3" fill="url(#goldFoil)"/>
    <circle cx="385" cy="120" r="3" fill="url(#goldFoil)"/>
    <circle cx="160" cy="415" r="3" fill="url(#goldFoil)"/>
    <circle cx="115" cy="380" r="3" fill="url(#goldFoil)"/>
  </g>

  <!-- Intertwined Monogram Initials: D & I -->
  <g text-anchor="middle">
    <!-- Letter D (Left) -->
    <text x="180" y="278" font-size="118" class="gold-serif-letter">D</text>

    <!-- Intertwined Ampersand & (Center) -->
    <text x="245" y="270" font-size="95" class="gold-ampersand">&amp;</text>

    <!-- Letter I for Irene (Right) -->
    <text x="320" y="278" font-size="118" class="gold-serif-letter">I</text>
  </g>
</svg>
