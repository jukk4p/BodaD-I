<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sube tus fotos y vídeos de la boda de Daniel y Irene">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Subir Fotos · Boda Daniel &amp; Irene</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page:       #e8ece9;
    --paper:      #f6f7f5;
    --ink:        #2f4a63;
    --ink-deep:   #1f3347;
    --ink-soft:   #5c7893;
    --gold:       #b4864c;
    --gold-soft:  #d9b98a;
    --gold-text:  #8a6636;
    --charcoal:   #2b2a27;
    --muted:      #6b7570;
    --mist:       #dbe1de;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Archivo', sans-serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(180, 134, 76, 0.10) 0%, transparent 60%),
      var(--page);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    overflow: hidden;
    max-width: 420px;
    width: 100%;
    background: var(--paper);
    border-radius: 24px;
    border: 1px solid rgba(180, 134, 76, 0.25);
    box-shadow: 0 20px 50px rgba(31, 51, 71, 0.15);
    padding: 2.6rem 1.8rem;
    text-align: center;
  }
  .header-mono {
    width: 52px; height: 52px;
    object-fit: cover; border-radius: 50%;
    margin: 0 auto 0.9rem;
    box-shadow: 0 6px 16px rgba(31,51,71,0.2), 0 0 0 1px rgba(180,134,76,0.35);
  }
  .eyebrow {
    font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold-text);
    margin-bottom: 0.6rem;
  }
  .lock-corner { position: absolute; width: 58px; height: 58px; object-fit: cover; opacity: 0.9; }
  .lock-corner-tl { top: 0; left: 0; border-radius: 0 0 16px 0; }
  .lock-corner-br { bottom: 0; right: 0; border-radius: 16px 0 0 0; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    color: var(--ink-deep);
    letter-spacing: 0.01em;
    margin-bottom: 0.6rem;
  }
  p {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 1.9rem;
  }
  .subtitle {
    display: flex; align-items: center; justify-content: center; gap: 0.45rem;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); flex: none;
    animation: livePulse 2.2s ease-out infinite;
  }
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(180, 134, 76, 0.55); }
    70%  { box-shadow: 0 0 0 6px rgba(180, 134, 76, 0); }
    100% { box-shadow: 0 0 0 0 rgba(180, 134, 76, 0); }
  }
  .preview-strip {
    display: flex;
    justify-content: center;
    gap: 0.55rem;
    margin: -0.8rem 0 1.8rem;
  }
  .preview-strip a {
    display: block;
    width: 84px; height: 84px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(180, 134, 76, 0.3);
    box-shadow: 0 6px 14px rgba(31, 51, 71, 0.14);
  }
  .preview-strip img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none !important; }
  }
  .btn-line {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    background: none; border: none;
    font-family: 'Archivo', sans-serif;
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--gold);
  }
  .btn-line.is-disabled {
    color: var(--muted);
    border-bottom-color: var(--mist);
    cursor: not-allowed;
  }
  .btn-line.is-uploading { cursor: wait; }
  .btn-line.is-uploading svg { animation: upload-spin 0.8s linear infinite; }
  @keyframes upload-spin { to { transform: rotate(360deg); } }
  .back-link {
    display: inline-block;
    margin-top: 1.8rem;
    font-family: 'Archivo', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--gold-text);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  .back-link:hover { border-color: var(--gold-text); }
  .live-counter {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: -0.8rem 0 1.6rem;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="lock-corner lock-corner-tl" src="img/floral-tr-crop.jpg" alt="" aria-hidden="true">
    <img class="lock-corner lock-corner-br" src="img/floral-bl-crop.jpg" alt="" aria-hidden="true">
    <img class="header-mono" src="img/monogram.png" alt="Monograma Daniel &amp; Irene">
    <p class="eyebrow">Daniel &amp; Irene · 24 Oct 2026</p>
    <h1>Comparte el Momento</h1>
    <p class="subtitle"><span class="live-dot" id="live-dot" hidden aria-hidden="true"></span><span id="subtitle-text">Comparte con nosotros las fotos y vídeos que vayáis haciendo durante el gran día.</span></p>
    <div class="preview-strip" id="preview-strip" hidden></div>
    <button class="btn-line" id="upload-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg> <span id="upload-btn-label">Subir Fotos y Vídeos</span></button>
    <input type="file" id="upload-input" multiple accept="image/*,video/*" style="display:none">
    <br>
    <a class="back-link" id="back-link" href="index.html?open=1">← Volver a la invitación</a>
  </div>

  <script src="js/upload.js"></script>
  <script>
    const GALLERY_WEBHOOK_URL = 'https://n8n.ivangonzalez.cloud/webhook/boda-daniel-irene-galeria';
    // Apertura 09:00 Sevilla (CEST). Offset +02:00 fijo para no depender
    // de la zona horaria del móvil.
    const uploadActive = Date.now() >= new Date('2026-10-24T09:00:00+02:00').getTime();
    const btn = document.getElementById('upload-btn');
    const btnLabel = document.getElementById('upload-btn-label');
    if (!uploadActive) {
      btn.classList.add('is-disabled');
      btnLabel.textContent = 'Disponible el día de la boda';
    } else {
      // Quien llega aquí vino del QR físico de la mesa de fotos, no de la
      // invitación — "volver a la invitación" no tiene sentido ese día.
      const backLink = document.getElementById('back-link');
      backLink.href = 'galeria.html';
      backLink.textContent = 'Ver galería en vivo →';
      document.getElementById('live-dot').hidden = false;
      document.getElementById('subtitle-text').textContent = '¡Hoy toca compartir! Sube tus fotos y vídeos del día.';

      // El id de cada archivo lleva su timestamp de subida como prefijo
      // ({timestampMs}_{hex}) — mismo criterio de orden que js/gallery.js.
      const uploadTimestamp = (id) => {
        const match = /^(\d+)_/.exec(id || '');
        return match ? parseInt(match[1], 10) : 0;
      };

      fetch(GALLERY_WEBHOOK_URL, { signal: AbortSignal.timeout(8000) })
        .then((res) => res.ok ? res.json() : Promise.reject())
        .then((items) => {
          if (!Array.isArray(items) || items.length === 0) return;
          const photoCount = items.filter((i) => i.mimeType && i.mimeType.startsWith('image/')).length;
          const videoCount = items.filter((i) => i.mimeType && i.mimeType.startsWith('video/')).length;
          document.getElementById('subtitle-text').textContent =
            `¡Ya van ${photoCount} foto(s) y ${videoCount} vídeo(s) compartidos! Súmate con los tuyos.`;

          const recent = items.slice().sort((a, b) => uploadTimestamp(b.id) - uploadTimestamp(a.id)).slice(0, 4);
          const strip = document.getElementById('preview-strip');
          recent.forEach((item) => {
            const thumbUrl = item.mimeType && item.mimeType.startsWith('video/') ? item.posterUrl : item.gridUrl;
            if (!thumbUrl) return;
            const link = document.createElement('a');
            link.href = 'galeria.html';
            const img = document.createElement('img');
            img.src = thumbUrl;
            img.alt = '';
            img.loading = 'lazy';
            link.appendChild(img);
            strip.appendChild(link);
          });
          if (strip.children.length > 0) strip.hidden = false;
        })
        .catch(() => {});
    }
    initUploadFlow({
      buttonId: 'upload-btn',
      inputId: 'upload-input',
      labelId: 'upload-btn-label',
      isActive: () => uploadActive,
      lockedMessage: '¡Esta sección se activará el día de la boda (24 de octubre de 2026)! Guardad vuestras fotos y compartidlas con nosotros ese día. 💍'
    });
  </script>
</body>
</html>
